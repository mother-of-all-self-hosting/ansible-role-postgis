---
# cli-non-interactive is exercised by verify_managed_databases.yml.
- name: Verify the PostGIS helper scripts
  hosts: all
  become: true
  gather_facts: false

  vars:
    postgis_verify_dump_directory: /root/molecule-dump

  tasks:
    - name: Run a query through the cli script (piped in)
      ansible.builtin.command:
        cmd: /postgis/bin/cli -tA
        stdin: SELECT current_user;
      register: postgis_verify_cli
      changed_when: false

    - name: Assert the cli script runs queries
      ansible.builtin.assert:
        that: (postgis_verify_cli.stdout | trim) == 'root'
        fail_msg: "The cli script did not run the query as `root`: {{ postgis_verify_cli.stdout }}{{ postgis_verify_cli.stderr }}"
        success_msg: "The cli script runs queries"

    - name: Ensure the dump directory exists
      ansible.builtin.file:
        path: "{{ postgis_verify_dump_directory }}"
        state: directory
        mode: "0700"

    - name: Dump all databases via the dump-all script
      ansible.builtin.command:
        cmd: /postgis/bin/dump-all {{ postgis_verify_dump_directory }}
      changed_when: true

    # zstd may not be available on the host, so the dump is checked in the PostGIS container.
    - name: Read the start of the dump
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail
          && docker exec -i postgis sh -c 'zstd --test && echo valid'
          < {{ postgis_verify_dump_directory }}/latest-dump.sql.zst
          && docker exec -i postgis sh -c 'zstd -dc | head -n 5'
          < {{ postgis_verify_dump_directory }}/latest-dump.sql.zst
        executable: /bin/bash
      register: postgis_verify_dump
      changed_when: false

    - name: Assert the dump is a complete Postgres cluster dump
      ansible.builtin.assert:
        that:
          - postgis_verify_dump.stdout_lines[0] == 'valid'
          - postgis_verify_dump.stdout is search('PostgreSQL database cluster dump')
        fail_msg: "The dump is not a complete Postgres cluster dump: {{ postgis_verify_dump.stdout }}{{ postgis_verify_dump.stderr }}"
        success_msg: "The dump-all script makes a complete Postgres cluster dump"
