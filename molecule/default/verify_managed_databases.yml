---
- name: Verify PostGIS managed databases
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # A fact rather than a play variable, because the checks below override
    # `postgis_managed_databases_additional` based on it.
    - name: Determine the managed databases to verify
      ansible.builtin.set_fact:
        postgis_verify_managed_dbs: "{{ postgis_managed_databases_additional }}"

    - name: Verify the managed databases which the role prepared while converging
      ansible.builtin.include_tasks: verify_managed_databases_tasks.yml
      loop: "{{ postgis_verify_managed_dbs }}"
      loop_control:
        loop_var: postgis_verify_managed_db
        label: "{{ postgis_verify_managed_db.name }}"

    - name: Include the variables the PostGIS role relies on
      ansible.builtin.include_role:
        name: com.devture.ansible.role.systemd_docker_base
        public: true

    # Preparation runs on every installation, against databases which already exist,
    # so it has to succeed on an already-prepared server and leave it prepared.
    - name: Prepare the managed databases again
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: util/prepare_managed_databases

    - name: Verify the managed databases after preparing them again
      ansible.builtin.include_tasks: verify_managed_databases_tasks.yml
      loop: "{{ postgis_verify_managed_dbs }}"
      loop_control:
        loop_var: postgis_verify_managed_db
        label: "{{ postgis_verify_managed_db.name }}"

    # Postgres may not accept connections yet when preparation starts (e.g. when it starts up slower
    # than `postgis_managed_databases_postgis_start_wait_timeout_seconds`). Postgres starts up too fast
    # here to reproduce that reliably, so it is made unreachable for a while instead, which psql fails on the same way.
    - name: Make Postgres unreachable for a while
      ansible.builtin.shell:
        cmd: >-
          docker network disconnect postgis postgis
          && systemd-run --on-active=10 docker network connect postgis postgis
      changed_when: true

    - name: Prepare the managed databases while Postgres is unreachable for a while
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: util/prepare_managed_databases

    - name: Verify the managed databases after preparing them while Postgres was unreachable for a while
      ansible.builtin.include_tasks: verify_managed_databases_tasks.yml
      loop: "{{ postgis_verify_managed_dbs }}"
      loop_control:
        loop_var: postgis_verify_managed_db
        label: "{{ postgis_verify_managed_db.name }}"

    # The failing statement echoes a password (the one which needs escaping) back in its error,
    # to check that the error is shown without it.
    - name: Verify that failing additional SQL fails the preparation
      ansible.builtin.include_tasks: verify_managed_databases_failure_tasks.yml
      vars:
        postgis_verify_failure_case: failing additional SQL
        postgis_verify_failure_managed_databases_additional:
          - "{{ postgis_verify_managed_dbs[0] }}"
          - "{{ postgis_verify_managed_dbs[1] | combine({'additional_sql_queries': [postgis_verify_failure_query]}) }}"
        postgis_verify_failure_query: "SELECT '{{ postgis_verify_managed_dbs[1].password | replace(\"'\", \"''\") }}'::integer;"
        postgis_verify_failure_connection_hostname: postgis
        postgis_verify_failure_expected_output: 'ERROR:  invalid input syntax for type integer'

    - name: Verify that failing to connect fails the preparation
      ansible.builtin.include_tasks: verify_managed_databases_failure_tasks.yml
      vars:
        postgis_verify_failure_case: failing to connect
        postgis_verify_failure_managed_databases_additional: "{{ postgis_verify_managed_dbs }}"
        postgis_verify_failure_connection_hostname: molecule-nonexistent-host
        postgis_verify_failure_expected_output: 'psql: error:'
