---
- name: Make Postgres reject connections ({{ postgis_verify_failure_case }})
  when: postgis_verify_failure_reject_connections | bool
  ansible.builtin.command:
    cmd: "{{ postgis_verify_reject_connections_command }}"
  changed_when: true

- name: Prepare the managed databases, expecting it to fail ({{ postgis_verify_failure_case }})
  block:
    - name: Prepare the managed databases ({{ postgis_verify_failure_case }})
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: util/prepare_managed_databases
      vars:
        postgis_managed_databases_additional: "{{ postgis_verify_failure_managed_databases_additional }}"
        # Failing to connect is retried, but retrying once is enough to see it given up on.
        postgis_managed_databases_connection_retries: 1
        postgis_managed_databases_connection_retry_delay_seconds: 1

    - name: Note that preparing the managed databases succeeded ({{ postgis_verify_failure_case }})
      ansible.builtin.set_fact:
        postgis_verify_failure_result: null
  rescue:
    - name: Note how preparing the managed databases failed ({{ postgis_verify_failure_case }})
      ansible.builtin.set_fact:
        postgis_verify_failure_result: "{{ ansible_failed_result }}"
  always:
    - name: Make Postgres accept connections again ({{ postgis_verify_failure_case }})
      when: postgis_verify_failure_reject_connections | bool
      ansible.builtin.command:
        cmd: "{{ postgis_verify_accept_connections_command }}"
      changed_when: true

- name: Assert that preparing the managed databases failed as expected ({{ postgis_verify_failure_case }})
  ansible.builtin.assert:
    that:
      - postgis_verify_failure_result is not none
      - postgis_verify_failure_expected_output in (postgis_verify_failure_result.msg | default(''))
      - postgis_verify_managed_dbs | map(attribute='password') | select('in', postgis_verify_failure_result | to_json) | list == []
    fail_msg: >-
      Preparing the managed databases ({{ postgis_verify_failure_case }})
      {% if postgis_verify_failure_result is none %}
      succeeded, but it should have failed.
      {% else %}
      did not fail as expected: the error should contain `{{ postgis_verify_failure_expected_output }}` but no passwords.
      Error:
      {{ (postgis_verify_failure_result.msg | default('')) | regex_replace(postgis_verify_managed_dbs | map(attribute='password') | map('regex_escape') | join('|'), '<password>') }}
      {% endif %}
    success_msg: >-
      Preparing the managed databases ({{ postgis_verify_failure_case }}) failed, explaining why without leaking passwords:
      {{ postgis_verify_failure_result.msg | default('') }}
