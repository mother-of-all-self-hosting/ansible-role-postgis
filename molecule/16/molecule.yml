---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: postgis-${MOLECULE_DISTRO:-ubuntu2604}-16
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        postgis_debug_service_enabled: false

        # Variables for PostGIS
        postgis_uid: 1000
        postgis_gid: 1000
        postgis_connection_password: password

        # Pin the major this scenario is named after. Verification reads the
        # image version for this major out of defaults/main.yml and asserts
        # both halves of it against the running server.
        postgis_allowed_versions_custom: [16]

        # Verification connects to this database as this user over TCP, which
        # is the only thing here that exercises managed database creation and
        # the template_postgis inheritance that consumers of this role rely on.
        postgis_managed_databases_additional:
          - name: molecule
            username: molecule
            password: molecule-managed-db-password
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
