---
- name: Ensure PostGIS service is started
  ansible.builtin.service:
    name: "{{ postgis_identifier }}"
    state: started
    daemon_reload: true
  register: postgis_ensure_started_result

- name: Wait a bit, so that PostGIS can start
  when: postgis_ensure_started_result.changed | bool
  ansible.builtin.wait_for:
    timeout: "{{ postgis_managed_databases_postgis_start_wait_timeout_seconds }}"
  delegate_to: 127.0.0.1
  become: false

# If PostGIS is up from before, but it had originally been installed on a different container network,
# trying to prepare databases by connecting to `postgis_container_network` would fail.
# For this reason, we determine and use the currently used network.
# Restarting the service later would put it in the current network.
- name: Check PostGIS container network
  ansible.builtin.command: "{{ devture_systemd_docker_base_host_command_docker }} container inspect {{ postgis_identifier }} --format '{% raw %}{{.HostConfig.NetworkMode}}{% endraw %}'"
  register: postgis_container_network_check_result
  changed_when: false

- name: Set PostGIS container network to use for preparing databases
  ansible.builtin.set_fact:
    postgis_container_network_for_preparing_databases: "{{ postgis_container_network_check_result.stdout }}"

- name: Detect managed databases with invalid fields
  ansible.builtin.set_fact:
    postgis_managed_databases_with_missing_keys: >-
      {%- set result = [] -%}
      {%- for db in postgis_managed_databases -%}
        {%- set missing = ['name', 'username', 'password'] | difference(db.keys() | list) -%}
        {%- if missing | length > 0 -%}
          {%- set _ = result.append({'name': db.name | default('<unknown>'), 'missing': missing}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}
  no_log: true

- name: Fail if managed database data appears invalid
  ansible.builtin.fail:
    msg: >-
      The following managed database definitions lack required keys:
      {% for db in postgis_managed_databases_with_missing_keys %}
      {{ db.name }} (missing: {{ db.missing | join(', ') }}){% if not loop.last %}, {% endif %}
      {% endfor %}
  when: postgis_managed_databases_with_missing_keys | length > 0

- name: Initialize managed databases
  no_log: true
  when: postgis_managed_databases | length > 0
  block:
    - name: Create managed database initialization SQL file
      ansible.builtin.template:
        src: "{{ role_path }}/templates/sql/init-managed-dbs-user-and-role.sql.j2"
        dest: "/tmp/{{ postgis_identifier }}-init-managed-dbs-user-and-role.sql"
        mode: "0600"
        owner: "{{ postgis_uid }}"
        group: "{{ postgis_gid }}"

    - name: Execute PostGIS managed database initialization SQL file
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} run
          --rm
          --user={{ postgis_container_uid }}:{{ postgis_container_gid }}
          {% if postgis_container_cap_drop_all_enabled %}
          --cap-drop=ALL
          {% endif %}
          --env-file={{ postgis_base_path }}/env-postgis-psql
          --network={{ postgis_container_network_for_preparing_databases }}
          --mount type=bind,src=/tmp/{{ postgis_identifier }}-init-managed-dbs-user-and-role.sql,dst=/{{ postgis_identifier }}-init-managed-dbs-user-and-role.sql,ro
          --entrypoint={{ postgis_container_shell_path }}
          {{ postgis_container_image_to_use }}
          -c
          'psql -v ON_ERROR_STOP=1 -v VERBOSITY=terse -h {{ postgis_connection_hostname }} --file=/{{ postgis_identifier }}-init-managed-dbs-user-and-role.sql'
      changed_when: true
      register: postgis_managed_dbs_init_result
      # Judged below, after the SQL file (which contains passwords) is deleted
      # and outside of `no_log`, so that the failure can be explained.
      failed_when: false

    - name: Delete managed database initialization SQL file
      ansible.builtin.file:
        path: /tmp/{{ postgis_identifier }}-init-managed-dbs-user-and-role.sql
        state: absent

    # psql reports errors (and notices) on stderr. `VERBOSITY=terse` above keeps it from quoting
    # the failing statement, but error messages may still contain values (e.g. passwords), so these are redacted.
    - name: Fail if the managed database initialization SQL file could not be executed
      when: postgis_managed_dbs_init_result.rc != 0
      no_log: false
      ansible.builtin.fail:
        msg: |-
          Initializing the managed databases failed: psql exited with code {{ postgis_managed_dbs_init_result.rc }}
          ({{ postgis_managed_dbs_init_psql_exit_codes[postgis_managed_dbs_init_result.rc] | default('see the output below') }}).
          Output (with passwords redacted):
          {{ postgis_managed_dbs_init_result.stderr | regex_replace(postgis_managed_dbs_init_passwords_regex, '********') }}
      vars:
        postgis_managed_dbs_init_psql_exit_codes:
          1: fatal psql error
          2: could not connect to Postgres, or the connection was lost
          3: an SQL statement failed
        postgis_managed_dbs_init_passwords: "{{ (postgis_managed_databases | map(attribute='password') | list + [postgis_connection_password]) | map('string') | select | unique | list }}"
        # Longest first, so that a password which contains another one is redacted whole.
        postgis_managed_dbs_init_passwords_regex: >-
          {{
            postgis_managed_dbs_init_passwords | map('length') | zip(postgis_managed_dbs_init_passwords)
            | sort(attribute='0', reverse=true) | map(attribute='1')
            | map('regex_escape') | join('|')
          }}

- name: Ensure PostGIS is stopped, if it originally was and if we are configured to do it
  when: postgis_systemd_service_stop_originally_stopped_after_preparation | bool and postgis_ensure_started_result.changed | bool
  ansible.builtin.service:
    name: "{{ postgis_identifier }}"
    state: stopped
