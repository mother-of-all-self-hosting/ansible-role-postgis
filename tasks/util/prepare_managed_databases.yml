---
- name: Ensure PostGIS service is started
  ansible.builtin.service:
    name: "{{ postgis_identifier }}"
    state: started
    daemon_reload: true
  register: postgis_ensure_started_result

- name: Wait a bit, so that PostGIS can start
  when: "postgis_ensure_started_result.changed | bool and (postgis_managed_databases_postgis_start_wait_timeout_seconds | int) > 0"
  ansible.builtin.wait_for:
    timeout: "{{ postgis_managed_databases_postgis_start_wait_timeout_seconds }}"
  delegate_to: 127.0.0.1
  become: false

- name: Detect managed databases with invalid fields
  ansible.builtin.set_fact:
    postgis_managed_databases_with_missing_keys: >-
      {%- set result = [] -%}
      {%- for db in postgis_managed_databases -%}
        {%- set missing = ['name', 'username', 'password'] | difference(db.keys() | list) -%}
        {%- if missing | length > 0 -%}
          {%- set _ = result.append({'name': db.name | default('<unknown>'), 'missing': missing}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}
  no_log: true

- name: Fail if managed database data appears invalid
  ansible.builtin.fail:
    msg: >-
      The following managed database definitions lack required keys:
      {% for db in postgis_managed_databases_with_missing_keys %}
      {{ db.name }} (missing: {{ db.missing | join(', ') }}){% if not loop.last %}, {% endif %}
      {% endfor %}
  when: postgis_managed_databases_with_missing_keys | length > 0

# Only the statements needed are run (see the module), so that this only reports a change when something did change.
# SQL is passed to psql on stdin, so that passwords do not end up in files or on command lines.
- name: Ensure managed databases are prepared
  when: postgis_managed_databases | length > 0
  postgis_managed_databases:
    # psql runs inside the (already started) Postgres container and connects the same way its readiness check does.
    psql_command: >-
      {{
        devture_systemd_docker_base_host_command_docker.split()
        + [
          'exec',
          '-i',
          '--env-file=' ~ postgis_base_path ~ '/env-postgis-psql',
          postgis_identifier,
          'psql',
          '--host=127.0.0.1',
          '--port=5432',
        ]
      }}
    # Only the keys the module knows about are passed (definitions may contain others).
    databases: |-
      {%- set result = [] -%}
      {%- for db in postgis_managed_databases -%}
        {%- set _ = result.append({
          'name': db.name,
          'username': db.username,
          'password': db.password | string,
          'additional_sql_queries': db.additional_sql_queries | default([]),
        }) -%}
      {%- endfor -%}
      {{ result }}
    lc_ctype: "{{ postgis_default_lc_type }}"
    lc_collate: "{{ postgis_default_lc_collate }}"
    # Provided by the PostGIS container image, with the PostGIS extensions already enabled.
    template: template_postgis
    connection_retries: "{{ postgis_managed_databases_connection_retries }}"
    connection_retry_delay_seconds: "{{ postgis_managed_databases_connection_retry_delay_seconds }}"
    redact_values:
      - "{{ postgis_connection_password }}"

- name: Ensure PostGIS is stopped, if it originally was and if we are configured to do it
  when: postgis_systemd_service_stop_originally_stopped_after_preparation | bool and postgis_ensure_started_result.changed | bool
  ansible.builtin.service:
    name: "{{ postgis_identifier }}"
    state: stopped
